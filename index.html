<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count the Chog!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Move overlay and custom alert outside of game-content -->
    <div class="overlay"></div>
    <div class="custom-alert">
        <h2></h2>
        <p></p>
        <button class="alert-btn">Continue</button>
    </div>

    <!-- Add countdown element -->
    <div class="countdown">3</div>

    <!-- Main Menu -->
    <div id="main-menu">
        <div class="banner-container">
            <img src="./assets/banner.jpeg" alt="Raccoon Game Banner" class="banner-image">
        </div>
        <div class="logo-container">
            <h1 class="game-title">Count the Chog!</h1>
        </div>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="startGame()">Play Game</button>
            <button class="menu-btn" onclick="showInstructions()">How to Play</button>
            <button class="menu-btn" onclick="showHighScores()">High Scores</button>
        </div>
    </div>

    <!-- Game Content -->
    <div id="game-content">
        <button class="back-btn" onclick="backToMenu()">Back to Menu</button>
        <h1>Count the Chog!</h1>
        <div id="score-display">Level: 1 | Press SPACE or CLICK to count chog!</div>
        <div id="game-container"></div>
        <button class="instructions-btn">❓ Instructions</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="./assets/bg-sound.mp3" type="audio/mp3">
    </audio>

    <!-- Add this right after the body tag opens -->
    <div class="snow-container"></div>

    <script>
        let currentLevel = 1;
        let actualRaccoonCount = 0;
        let userCount = 0;
        let gameActive = false;
        let animals = [
            'assets/chog.png',
            'assets/mon.png',
            'assets/monadverse.png',
            'assets/over.png',
            'assets/spiky.png'
        ];

        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score-display');

        function resetGame() {
            // Don't reset currentLevel here unless going back to menu
            actualRaccoonCount = 0;
            userCount = 0;
            activeAnimals = 0;
            gameActive = false;
            
            // Clear any remaining animals and ongoing animations
            gameContainer.innerHTML = '';
            
            // Clear ALL timeouts and intervals
            const highestTimeoutId = setTimeout(";");
            for (let i = 0; i < highestTimeoutId; i++) {
                clearTimeout(i);
                clearInterval(i);
            }
            
            // Clear any existing animation frames
            const highestAnimationFrame = requestAnimationFrame(() => {});
            for (let i = 1; i < highestAnimationFrame; i++) {
                cancelAnimationFrame(i);
            }
            
            // Reset score display with current level
            scoreDisplay.textContent = `Level: ${currentLevel} | Count: ${userCount}`;
            
            // Hide any visible alerts
            const alert = document.querySelector('.custom-alert');
            const overlay = document.querySelector('.overlay');
            alert.style.display = 'none';
            overlay.style.display = 'none';
            
            // Reset countdown
            const countdown = document.querySelector('.countdown');
            countdown.style.display = 'none';
            countdown.textContent = '3';
        }

        function startLevel() {
            resetGame();
            
            gameActive = true;
            actualRaccoonCount = 0;
            userCount = 0;
            scoreDisplay.textContent = `Level: ${currentLevel} | Count: ${userCount}`;
            
            const totalAnimals = 5 + (currentLevel * 2);
            
            let animalSequence = new Array(totalAnimals).fill(false);
            const minChog = Math.max(2, Math.floor(totalAnimals * 0.2));
            const maxChog = Math.ceil(totalAnimals * Math.max(0.3, 0.8 - (currentLevel * 0.05)));
            const rabbitCount = Math.floor(Math.random() * (maxChog - minChog + 1)) + minChog;
            
            for(let i = 0; i < rabbitCount; i++) {
                let position;
                do {
                    position = Math.floor(Math.random() * totalAnimals);
                } while(animalSequence[position]);
                animalSequence[position] = true;
            }
            
            // Clear any existing spawn sequence
            const highestTimeoutId = setTimeout(";");
            for (let i = 0; i < highestTimeoutId; i++) {
                clearTimeout(i);
            }
            
            // Track spawned and completed animals
            let spawnedAnimals = 0;
            let completedAnimals = 0;
            
            // Adjust game duration based on level
            const baseGameDuration = 10000; // 10 seconds base
            const gameDuration = Math.max(baseGameDuration - (currentLevel * 500), 5000); // Minimum 5 seconds
            
            animalSequence.forEach((isRabbit, index) => {
                // Random spawn time within the game duration
                const randomDelay = Math.random() * (gameDuration * 0.7); // Use 70% of total time for spawns
                
                setTimeout(() => {
                    spawnAnimal(isRabbit, () => {
                        completedAnimals++;
                        if (completedAnimals === totalAnimals) {
                            setTimeout(() => {
                                gameActive = false;
                                checkAnswer();
                            }, 500); // Small delay to ensure all animations complete
                        }
                    });
                    spawnedAnimals++;
                }, randomDelay);
            });
        }

        function spawnAnimal(isRaccoon, onComplete) {
            activeAnimals++;
            const animal = document.createElement('div');
            animal.className = 'animal';
            
            const containerHeight = gameContainer.offsetHeight;
            const containerWidth = gameContainer.offsetWidth;
            const minY = containerHeight * 0.1; // 10% from top
            const maxY = containerHeight * 0.8; // 80% from top
            
            const randomY = minY + Math.random() * (maxY - minY);
            animal.style.top = randomY + 'px';
            
            // Adjust starting position based on container width
            const startX = -60; // Animal width
            animal.style.left = startX + 'px';
            
            const img = document.createElement('img');
            img.src = isRaccoon ? animals[0] : animals[Math.floor(Math.random() * (animals.length - 1)) + 1];
            animal.appendChild(img);
            
            if (isRaccoon) actualRaccoonCount++;
            
            gameContainer.appendChild(animal);
            
            let posX = startX;
            // Reduced base speed and level scaling
            const baseSpeed = (containerWidth / 800) * (1.5 + (currentLevel * 0.3));
            const speed = baseSpeed + Math.random() * (baseSpeed * 0.2); // Reduced speed variation
            
            // Reduced amplitude scaling
            const amplitude = (containerHeight / 800) * (3 + Math.random() * 5 + (currentLevel));
            const frequency = (0.001 + Math.random() * 0.001) * (1 + currentLevel * 0.05); // Reduced frequency
            
            let startTime = Date.now();
            let initialY = parseFloat(animal.style.top);
            
            function animate() {
                const elapsed = Date.now() - startTime;
                posX += speed;
                
                const newY = initialY + Math.sin(elapsed * frequency) * amplitude;
                
                animal.style.left = posX + 'px';
                animal.style.top = newY + 'px';
                
                if (posX < containerWidth + 60) {
                    requestAnimationFrame(animate);
                } else {
                    animal.remove();
                    activeAnimals--;
                    if (onComplete) onComplete();
                }
            }
            
            requestAnimationFrame(animate);
        }

        function showCustomAlert(title, message, isSuccess) {
            const alert = document.querySelector('.custom-alert');
            const overlay = document.querySelector('.overlay');
            
            // Reset any existing content
            if (alert.querySelector('ul')) {
                alert.querySelector('ul').remove();
                const p = document.createElement('p');
                alert.insertBefore(p, alert.querySelector('.alert-btn'));
            }
            
            alert.querySelector('h2').textContent = title;
            
            // Check if it's instructions to use list or regular message
            if (title === "How to Play") {
                const list = document.createElement('ul');
                list.className = 'instructions-list';
                
                const instructions = [
                    "Watch for chog moving across the screen",
                    "Press SPACE each time you see a rabbit",
                    "Avoid counting other animals",
                    "Complete each level to advance",
                    "Be careful - one mistake sends you back to level 1!"
                ];

                instructions.forEach(instruction => {
                    const li = document.createElement('li');
                    li.textContent = instruction;
                    list.appendChild(li);
                });

                const oldP = alert.querySelector('p');
                alert.replaceChild(list, oldP);
            } else {
                const messageEl = alert.querySelector('p');
                messageEl.textContent = message;
                messageEl.style.whiteSpace = 'pre-wrap'; // Preserve line breaks
                messageEl.style.textAlign = 'center';
                messageEl.style.margin = '20px 0';
                messageEl.style.lineHeight = '1.5';
            }
            
            alert.className = 'custom-alert ' + (isSuccess ? 'success' : 'error');
            overlay.style.display = 'block';
            alert.style.display = 'block';

            const continueBtn = alert.querySelector('.alert-btn');
            continueBtn.onclick = () => {
                overlay.style.display = 'none';
                alert.style.display = 'none';
                // Don't start level if we're on main menu
                if (!document.getElementById('main-menu').style.display || 
                    document.getElementById('main-menu').style.display === 'none') {
                    startCountdown();
                }
            };
        }

        function checkAnswer() {
            if (userCount === actualRaccoonCount) {
                showCustomAlert(
                    "Great Job!", 
                    `Correct! Moving to level ${currentLevel + 1}`,
                    true
                );
                currentLevel++;
                scoreDisplay.textContent = `Level: ${currentLevel} | Count: ${userCount}`;
            } else {
                // Calculate score based on levels completed
                const finalScore = currentLevel - 1; // Subtract 1 because they failed the current level
                const scoreMessage = `Game Over!\n\nFinal Score: ${finalScore} ${finalScore === 1 ? 'level' : 'levels'} completed\n` +
                    `Your count: ${userCount}\nActual chogs: ${actualRaccoonCount}\n\n` +
                    `${getFeedbackMessage(finalScore)}`;
                
                showCustomAlert(
                    "Oops!", 
                    scoreMessage,
                    false
                );
                currentLevel = 1;
                scoreDisplay.textContent = `Level: ${currentLevel} | Count: ${userCount}`;
            }
        }

        // Add function to generate feedback message based on score
        function getFeedbackMessage(score) {
            if (score === 0) return "Keep practicing! You'll get better!";
            if (score < 3) return "Good start! Try again to beat your score!";
            if (score < 5) return "Well done! You're getting good at this!";
            if (score < 8) return "Impressive! You're becoming a chog counting expert!";
            if (score < 10) return "Amazing! You're a natural chog counter!";
            return "Incredible! You're a legendary chog counter!";
        }

        // Update the keydown event listener and add click event listener
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                handleCount();
            }
        });

        // Add click event listener to game container
        gameContainer.addEventListener('click', () => {
            handleCount();
        });

        // Update handle count to prevent multiple rapid clicks
        let lastClickTime = 0;
        const clickCooldown = 200; // 200ms cooldown between clicks

        function handleCount() {
            const currentTime = Date.now();
            if (currentTime - lastClickTime < clickCooldown) {
                return; // Ignore clicks during cooldown
            }
            lastClickTime = currentTime;

            if (!gameActive) {
                startLevel();
            } else {
                userCount++;
                scoreDisplay.textContent = `Level: ${currentLevel} | Count: ${userCount}`;
            }
        }

        function startGame() {
            resetGame();
            
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-content').style.display = 'block';
            
            console.log('Game started, attempting music start');
            startMusic(); // Try to start music when game starts
            
            // Show instructions first, then start countdown when user clicks continue
            showInstructions();
        }

        function showInstructions() {
            const alert = document.querySelector('.custom-alert');
            const overlay = document.querySelector('.overlay');
            
            alert.querySelector('h2').textContent = "How to Play";
            
            // Create guide container
            const guideContainer = document.createElement('div');
            guideContainer.className = 'guide-container';
            
            // Add chog image with label
            const chogGuide = document.createElement('div');
            chogGuide.className = 'guide-item';
            chogGuide.innerHTML = `
                <img src="assets/chog.png" alt="Chog" class="guide-img">
                <p>✅ Count this one!</p>
            `;
            
            // Add other animals with label
            const otherGuide = document.createElement('div');
            otherGuide.className = 'guide-item';
            otherGuide.innerHTML = `
                <div class="other-animals">
                    <img src="assets/mon.png" alt="Other" class="guide-img">
                    <img src="assets/monadverse.png" alt="Other" class="guide-img">
                    <img src="assets/over.png" alt="Other" class="guide-img">
                    <img src="assets/spiky.png" alt="Other" class="guide-img">
                </div>
                <p>❌ Don't count these!</p>
            `;
            
            guideContainer.appendChild(chogGuide);
            guideContainer.appendChild(otherGuide);
            
            // Add instructions list
            const list = document.createElement('ul');
            list.className = 'instructions-list';
            
            const instructions = [
                "Watch for chog moving across the screen",
                "Press SPACE or CLICK each time you see a chog",
                "Avoid counting other animals",
                "Complete each level to advance",
                "Be careful - one mistake sends you back to level 1!"
            ];

            instructions.forEach(instruction => {
                const li = document.createElement('li');
                li.textContent = instruction;
                list.appendChild(li);
            });
            
            // Clear existing content and add new elements
            const oldContent = alert.querySelector('p');
            if (oldContent) oldContent.remove();
            if (alert.querySelector('ul')) alert.querySelector('ul').remove();
            if (alert.querySelector('.guide-container')) alert.querySelector('.guide-container').remove();
            
            alert.insertBefore(guideContainer, alert.querySelector('.alert-btn'));
            alert.insertBefore(list, alert.querySelector('.alert-btn'));
            
            overlay.style.display = 'block';
            alert.style.display = 'block';

            // Add continue button functionality for instructions
            const continueBtn = alert.querySelector('.alert-btn');
            continueBtn.onclick = () => {
                overlay.style.display = 'none';
                alert.style.display = 'none';
                // Only start countdown if we're in the game screen
                if (document.getElementById('game-content').style.display === 'block') {
                    startCountdown();
                }
            };
        }

        function showHighScores() {
            showCustomAlert(
                "High Scores",
                "Coming Soon!\nCan you become the ultimate raccoon counter?",
                true
            );
        }

        function backToMenu() {
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('game-content').style.display = 'none';
            // Reset game when going back to menu
            resetGame();
        }

        function startCountdown() {
            const countdown = document.querySelector('.countdown');
            let count = 3;
            countdown.textContent = count;
            countdown.style.display = 'block';

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdown.textContent = count;
                } else if (count === 0) {
                    countdown.textContent = 'GO!';
                } else {
                    clearInterval(timer);
                    countdown.style.display = 'none';
                    startLevel();
                }
            }, 1000);
        }

        // Update music initialization
        const bgMusic = document.getElementById('bgMusic');
        
        // Set initial music state
        let isMusicOn = false; // Start with false to ensure proper state tracking
        
        // Create and style music button
        const musicBtn = document.createElement('button');
        musicBtn.className = 'music-btn';
        musicBtn.innerHTML = '🔊 Music: Off'; // Start with Off state
        document.body.appendChild(musicBtn);

        // Function to start music
        function startMusic() {
            if (!isMusicOn) { // Only start if not already playing
                bgMusic.play()
                    .then(() => {
                        isMusicOn = true;
                        musicBtn.innerHTML = '🔊 Music: On';
                        bgMusic.volume = 0.3;
                        console.log('Music started successfully');
                    })
                    .catch(error => {
                        console.log("Music start failed:", error);
                        isMusicOn = false;
                        musicBtn.innerHTML = '🔊 Music: Off';
                    });
            }

        }

        // Function to stop music
        function stopMusic() {
            bgMusic.pause();
            bgMusic.currentTime = 0;
            isMusicOn = false;
            musicBtn.innerHTML = '🔊 Music: Off';
        }

        // Set audio properties
        bgMusic.loop = true;
        bgMusic.volume = 0.3;
        bgMusic.preload = 'auto';
        
        // Improved music toggle functionality
        musicBtn.onclick = () => {
            if (!isMusicOn) {
                startMusic();
            } else {
                stopMusic();
            }
            console.log('Music state:', isMusicOn); // Debug log
        };

        // Try to start music on various events
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, attempting music start');
            startMusic();
        });

        window.addEventListener('load', () => {
            console.log('Window loaded, attempting music start');
            startMusic();
        });

        // Start music on first interaction
        document.addEventListener('click', function initMusic() {
            console.log('First click, attempting music start');
            startMusic();
            document.removeEventListener('click', initMusic);
        }, { once: true });

        // Debug function to check audio state
        function checkAudioState() {
            console.log('Music playing:', !bgMusic.paused);
            console.log('Current time:', bgMusic.currentTime);
            console.log('Volume:', bgMusic.volume);
            console.log('Music state:', isMusicOn);
        }

        // Check audio state periodically
        setInterval(checkAudioState, 5000);

        const copyright = document.createElement('div');
        copyright.className = 'copyright';
        copyright.innerHTML = '© 2025 <a href="https://github.com/mnalfiansyah" target="_blank">Dolpin</a>';
        document.body.appendChild(copyright);

        // Create snow effect
        function createSnow() {
            const snowContainer = document.querySelector('.snow-container');
            const snowflakeCount = 50; // Adjust number of snowflakes

            for (let i = 0; i < snowflakeCount; i++) {
                const snow = document.createElement('div');
                snow.className = 'snow';
                
                // Random properties for each snowflake
                const randomX = Math.random() * window.innerWidth;
                const randomDuration = 5 + Math.random() * 10; // Between 5-15s
                const randomDelay = Math.random() * 5; // Between 0-5s
                const randomSize = 3 + Math.random() * 7; // Between 3-10px
                const randomOpacity = 0.4 + Math.random() * 0.6; // Between 0.4-1

                // Apply random styles
                snow.style.left = `${randomX}px`;
                snow.style.width = `${randomSize}px`;
                snow.style.height = `${randomSize}px`;
                snow.style.opacity = randomOpacity;
                snow.style.animationDuration = `${randomDuration}s`;
                snow.style.animationDelay = `${randomDelay}s`;

                snowContainer.appendChild(snow);

                // Remove and recreate snowflake after animation ends
                snow.addEventListener('animationend', () => {
                    snow.remove();
                    createSnowflake();
                });
            }
        }

        // Create a single snowflake
        function createSnowflake() {
            const snowContainer = document.querySelector('.snow-container');
            const snow = document.createElement('div');
            snow.className = 'snow';
            
            const randomX = Math.random() * window.innerWidth;
            const randomDuration = 5 + Math.random() * 10;
            const randomSize = 3 + Math.random() * 7;
            const randomOpacity = 0.4 + Math.random() * 0.6;

            snow.style.left = `${randomX}px`;
            snow.style.width = `${randomSize}px`;
            snow.style.height = `${randomSize}px`;
            snow.style.opacity = randomOpacity;
            snow.style.animationDuration = `${randomDuration}s`;

            snowContainer.appendChild(snow);

            snow.addEventListener('animationend', () => {
                snow.remove();
                createSnowflake();
            });
        }

        // Initialize snow effect
        window.addEventListener('load', createSnow);

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const snowContainer = document.querySelector('.snow-container');
                snowContainer.innerHTML = '';
                createSnow();
            }, 200);
        });

        // Add these styles to your CSS
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
            .guide-container {
                display: flex;
                flex-direction: column;
                gap: 20px;
                margin: 20px 0;
                padding: 15px;
                background: rgba(255, 255, 255, 0.9);
                border-radius: 15px;
                border: 2px solid #ff9eaf;
            }

            .guide-item {
                text-align: center;
            }

            .guide-img {
                width: 50px;
                height: 50px;
                object-fit: contain;
                margin: 5px;
            }

            .other-animals {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin-bottom: 5px;
            }

            .guide-item p {
                margin: 5px 0;
                font-weight: bold;
                color: #4a4a4a;
            }

            @media screen and (max-width: 480px) {
                .guide-img {
                    width: 40px;
                    height: 40px;
                }
                
                .guide-item p {
                    font-size: 0.9em;
                }
            }
        `;

        document.head.appendChild(styleSheet);

        // Add styles for the instructions button
        styleSheet.textContent += `
            .instructions-btn {
                position: fixed;
                top: 30px;
                right: 30px;
                padding: 12px 25px;
                background: white;
                color: #9A3CFD;
                border: 3px solid #ff9eaf;
                border-radius: 25px;
                font-family: 'Comic Sans MS', cursive;
                font-size: 1.1em;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 5px 15px rgba(255, 158, 175, 0.2);
                z-index: 100;
            }

            .instructions-btn:hover {
                background: #ff9eaf;
                color: white;
                transform: translateY(-3px) scale(1.05);
                box-shadow: 0 8px 20px rgba(255, 158, 175, 0.4);
            }

            @media screen and (max-width: 768px) {
                .instructions-btn {
                    top: 15px;
                    right: 15px;
                    padding: 8px 20px;
                    font-size: 1em;
                }
            }

            @media screen and (max-width: 480px) {
                .instructions-btn {
                    padding: 6px 15px;
                    font-size: 0.9em;
                }
            }
        `;

        // Add some additional styles for the score display
        styleSheet.textContent += `
            .custom-alert p {
                white-space: pre-wrap;
                line-height: 1.6;
                margin: 20px 0;
                text-align: left;
                padding: 0 20px;
            }

            .custom-alert.error p {
                color: #4a4a4a;
                font-size: 1.1em;
            }

            @media screen and (max-width: 480px) {
                .custom-alert p {
                    font-size: 0.9em;
                    padding: 0 10px;
                }
            }
        `;
    </script>
</body>
</html>
